<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presenter</title>
<style>
  @font-face { font-family: "Inter"; font-weight: 400; src: url("../assets/fonts/Inter-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 500; src: url("../assets/fonts/Inter-Medium.woff2") format("woff2"); }
  @font-face { font-family: "Noto Sans Devanagari"; font-weight: 400; src: url("../assets/fonts/noto-sans-devanagari-devanagari-400-normal.woff2") format("woff2");
    unicode-range: U+0900-097F, U+200C-200D, U+25CC; }
  @font-face { font-family: "Plex Mono"; font-weight: 400; src: url("../assets/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); }
  :root { --bg: #0E0F12; --fg: #F2EDE4; --fg2: #8C8A85; --red: #C8372D; --hair: #2A2B30; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
  body { font-family: "Inter", "Noto Sans Devanagari", "Nirmala UI", "Segoe UI", system-ui, sans-serif; padding: 40px 48px; display: grid;
    grid-template-rows: auto 1fr auto; row-gap: 32px; -webkit-font-smoothing: antialiased; }
  .mono { font-family: "Plex Mono", Consolas, monospace; letter-spacing: 0.06em; }
  header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--hair); padding-bottom: 20px; }
  #where { font-size: 18px; color: var(--fg2); text-transform: uppercase; }
  #time { font-size: 48px; font-feature-settings: "tnum"; }
  #time.over { color: var(--red); }
  main { display: grid; grid-template-rows: auto auto; row-gap: 40px; align-content: start; }
  .lbl { font-size: 14px; color: var(--fg2); text-transform: uppercase; margin-bottom: 12px; }
  #now { font-size: 40px; line-height: 1.35; font-weight: 500; letter-spacing: -0.01em; max-width: 34em; }
  #next { font-size: 26px; line-height: 1.45; color: var(--fg2); max-width: 44em; }
  #screen { font-size: 20px; line-height: 1.5; color: var(--fg2); }
  footer { border-top: 1px solid var(--hair); padding-top: 16px; font-size: 14px; color: var(--fg2); display: flex; justify-content: space-between; }
  #link.off { color: var(--red); }
</style>
</head>
<body>
<header>
  <div id="where" class="mono">Waiting for the deck…</div>
  <div id="time" class="mono">0:00</div>
</header>
<main>
  <section><div class="lbl mono">Say now</div><div id="now"></div></section>
  <section><div class="lbl mono">Then</div><div id="next"></div></section>
  <section><div class="lbl mono">On screen</div><div id="screen"></div></section>
</main>
<footer class="mono"><span>Keys here also drive the deck: Space / arrows / PgUp / PgDn · B · T</span><span id="link">not linked</span></footer>

<script src="content.js"></script>
<script>
(function () {
  'use strict';
  var D = window.DECK || { slides: [] }, APP = String(D.appName || '');
  function fill(s) { return String(s == null ? '' : s).replace(/\{app\}/g, APP); }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  var slides = (D.slides || []).map(function (s) {
    var beats = (s.beats || []).filter(function (b) { return !b.optional || D.showOptional !== false; });
    if (!beats.length) beats = [{ say: '', show: [] }];
    return { id: s.id, speaker: s.speaker, black: s.black, beats: beats };
  });
  var steps = [];
  slides.forEach(function (s, si) {
    if (si === 0) steps.push({ s: 0, b: -1 });
    s.beats.forEach(function (b, bi) { steps.push({ s: si, b: bi }); });
  });
  document.title = APP + ' · presenter';

  var state = null, lastSid = '', lastN = 0;
  var $ = function (id) { return document.getElementById(id); };
  function sayOf(st) {
    if (!st) return '(end)';
    if (st.b < 0) return '(opening image, silent. Press Space for the first line.)';
    var sl = slides[st.s], b = sl.beats[st.b];
    return (sl.speaker ? sl.speaker + ': ' : '') + fill(b.say);
  }
  function render() {
    if (!state) return;
    var st = steps[state.step], nx = steps[state.step + 1];
    $('where').textContent = 'Slide ' + pad2(st.s + 1) + ' / ' + pad2(slides.length) + '  ·  ' + (st.b < 0 ? 'start' : 'beat ' + (st.b + 1) + ' / ' + slides[st.s].beats.length) + (state.black ? '  ·  BLACK' : '');
    $('now').textContent = sayOf(st);
    $('next').textContent = nx ? (nx.s !== st.s ? '[next slide] ' : '') + sayOf(nx) : '(end of deck)';
    var show = st.b >= 0 ? (slides[st.s].beats[st.b].show || []).map(fill).join('  /  ') : '';
    $('screen').textContent = slides[st.s].black ? '(black: live demo)' : show;
    $('link').textContent = 'linked'; $('link').className = '';
  }
  function tick() {
    if (!state || !state.timer) return;
    var t = state.timer, ms = t.base + (t.running ? Date.now() - t.since : 0), s = Math.floor(ms / 1000);
    $('time').textContent = Math.floor(s / 60) + ':' + pad2(s % 60);
    $('time').className = 'mono' + (ms >= 180000 ? ' over' : '');
  }
  setInterval(tick, 250);

  function onState(m) {
    if (!m || m.from !== 'deck' || m.type !== 'state') return;
    if (m.sid === lastSid && m.n <= lastN) return;      // same message via another channel, or an older one
    lastSid = m.sid; lastN = m.n; state = m; render(); tick();
  }
  var chan = null;
  try { chan = new BroadcastChannel('pitch-deck'); chan.onmessage = function (e) { onState(e.data); }; } catch (e) {}
  window.addEventListener('message', function (e) { onState(e.data); });
  window.addEventListener('storage', function (e) {
    if (e.key === 'pitch-deck-state' && e.newValue) try { onState(JSON.parse(e.newValue)); } catch (x) {}
  });
  try { var saved = localStorage.getItem('pitch-deck-state'); if (saved) onState(JSON.parse(saved)); } catch (e) {}

  var n = 0;
  function send(m) {
    m.from = 'presenter'; m.id = Date.now() + '-p' + (++n);
    if (chan) try { chan.postMessage(m); } catch (e) {}
    if (window.opener && !window.opener.closed) try { window.opener.postMessage(m, '*'); } catch (e) {}
    try { localStorage.setItem('pitch-deck-cmd', JSON.stringify(m)); } catch (e) {}
  }
  send({ type: 'hello' });

  var FORWARD = { ' ': 1, ArrowRight: 1, ArrowLeft: 1, ArrowUp: 1, ArrowDown: 1, PageUp: 1, PageDown: 1, b: 1, B: 1, t: 1, T: 1, '.': 1 };
  window.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    if (e.key === 'F5') { e.preventDefault(); return; }
    if (FORWARD[e.key] && !e.repeat) { e.preventDefault(); send({ type: 'key', key: e.key, shift: e.shiftKey }); }
  });
  window.addEventListener('wheel', function (e) { e.preventDefault(); }, { passive: false });
})();
</script>
</body>
</html>
