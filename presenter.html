<!doctype html>
<html lang="en" data-theme="ink">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presenter</title>
<style>
  @font-face { font-family: "Instrument Sans"; src: url("assets/fonts/instrument-sans-latin-wdth-normal.woff2") format("woff2"); font-weight: 400 700; font-stretch: 75% 100%; font-display: block; }
  @font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: block; }
  @font-face { font-family: "Noto Sans Devanagari"; src: url("assets/fonts/noto-sans-devanagari-devanagari-400-normal.woff2") format("woff2"); font-weight: 400; font-display: block; unicode-range: U+0900-097F, U+200C-200D, U+25CC; }
  :root { --bg: #121212; --text: #F1EDE4; --text-2: #A29C92; --rule: #2C2C2C; --accent: #E04A3E; --typed: #4FC1B1; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body { font-family: "Instrument Sans", "Noto Sans Devanagari", sans-serif; display: grid; grid-template-rows: auto 1fr auto; padding: 32px 48px; box-sizing: border-box; gap: 24px; -webkit-font-smoothing: antialiased; }
  .label { font-family: "IBM Plex Mono", monospace; font-size: 16px; letter-spacing: 0.02em; color: var(--text-2); }
  header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--rule); padding-bottom: 16px; }
  header .num { color: var(--accent); margin-right: 12px; }
  #timer { font-family: "IBM Plex Mono", monospace; font-size: 40px; color: var(--text); font-variant-numeric: tabular-nums; }
  #timer.over { color: var(--accent); }
  main { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  #speaker { color: var(--accent); }
  #say { font-size: 40px; line-height: 1.3; font-weight: 500; text-wrap: pretty; max-width: 40ch; }
  #say .dir, #next .dir { color: var(--text-2); font-weight: 400; font-style: normal; }
  #say .who, #next .who { color: var(--typed); font-weight: 600; }
  footer { border-top: 1px solid var(--rule); padding-top: 16px; display: grid; grid-template-columns: 160px 1fr; gap: 24px; }
  #next { font-size: 24px; line-height: 1.35; color: var(--text-2); text-wrap: pretty; }
  #wait { color: var(--text-2); font-size: 24px; }
  .demo #say { color: var(--text); }
</style>
</head>
<body>
<header>
  <div class="label"><span class="num" id="num">00</span><span id="section">Waiting for the deck</span> · beat <span id="beat">0 / 0</span></div>
  <div id="timer">0:00</div>
</header>
<main>
  <div class="label" id="speaker"></div>
  <div id="say"><span id="wait">Open the deck (index.html) and press P there, or press any arrow key here once the deck is open.</span></div>
</main>
<footer>
  <div class="label">Next</div>
  <div id="next"></div>
</footer>
<script>
(function () {
  'use strict';
  var CHANNEL = 'pitch-deck';
  var chan = null;
  try { chan = 'BroadcastChannel' in window ? new BroadcastChannel(CHANNEL) : null; } catch (e) { chan = null; }
  var state = null;
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  // stage directions in brackets go grey, speaker names (TANISH:, BOTH:) get a colour
  function fmt(s) {
    return esc(s)
      .replace(/\(([^)]*)\)/g, '<span class="dir">($1)</span>')
      .replace(/\b(TANISH|JEBISHA|BOTH)\b:?/g, '<span class="who">$&</span>');
  }
  function render(m) {
    if (!m || m.type !== 'state') return;
    state = m;
    $('num').textContent = m.num;
    $('section').textContent = m.section;
    $('beat').textContent = m.beat + ' / ' + m.beats;
    $('speaker').textContent = (m.demo ? 'Live demo · ' : '') + (m.speaker || '');
    $('say').innerHTML = fmt(m.say) || '<span class="dir">(no line for this beat)</span>';
    $('next').innerHTML = m.next ? (m.next.sameSlide ? '' : '<span class="label">' + esc(m.next.num + ' ' + m.next.section) + '</span><br>') + fmt(m.next.say) : '<span class="dir">End of the deck.</span>';
    document.body.classList.toggle('demo', !!m.demo);
    tick();
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function tick() {
    var start = state && state.timer && state.timer.start;
    var s = start ? Math.floor((Date.now() - start) / 1000) : 0;
    $('timer').textContent = Math.floor(s / 60) + ':' + pad2(s % 60);
    $('timer').classList.toggle('over', s >= 180);
  }
  setInterval(tick, 250);
  function send(cmd) {
    var m = { type: 'cmd', cmd: cmd, t: Date.now() };
    if (chan) { try { chan.postMessage(m); } catch (e) { /* ignore */ } }
    try { localStorage.setItem(CHANNEL + '-cmd', JSON.stringify(m)); } catch (e) { /* ignore */ }
  }
  if (chan) chan.onmessage = function (e) { render(e.data); };
  window.addEventListener('storage', function (e) {
    if (e.key === CHANNEL + '-state' && e.newValue) { try { render(JSON.parse(e.newValue)); } catch (err) { /* ignore */ } }
  });
  try { var saved = localStorage.getItem(CHANNEL + '-state'); if (saved) render(JSON.parse(saved)); } catch (e) { /* ignore */ }
  send('hello');
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    var k = e.key;
    if (k === ' ' || k === 'ArrowRight' || k === 'PageDown' || k === 'ArrowDown') send('next');
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'ArrowUp') send('prev');
    else if (e.code === 'KeyT' && e.shiftKey) send('timer-reset');
    else return;
    e.preventDefault();
  });
})();
</script>
</body>
</html>
